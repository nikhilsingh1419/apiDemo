spring.application.name=apidemo
server.port=${PORT:8080}

# Supabase PostgreSQL
# Local: run with -Dspring.profiles.active=local (uses application-local.properties).
# Render: set DATABASE_URL env var to the same JDBC URL with your password.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: create/update table from entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Google OAuth (mobile): comma-separated Android, iOS, and Web client IDs
app.auth.google-client-ids=${GOOGLE_CLIENT_IDS:}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.jwt-expiration-ms=${JWT_EXPIRATION_MS:604800000}
