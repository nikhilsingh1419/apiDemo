spring.datasource.url=jdbc:h2:mem:apidemo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.auth.google-client-ids=test-android.apps.googleusercontent.com,test-web.apps.googleusercontent.com
app.auth.jwt-secret=test-jwt-secret-key-with-at-least-32-bytes
app.auth.jwt-expiration-ms=3600000
app.auth.jwt-remember-me-expiration-ms=604800000
app.auth.jwt-short-expiration-ms=86400000
app.auth.password-reset-expiration-ms=3600000
